name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3.12 -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]' build
      - run: .venv/bin/pytest -ra -o faulthandler_timeout=60
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m build
