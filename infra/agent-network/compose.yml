services:
  squid:
    # Digest of the locally tested ubuntu/squid image (Squid 6.13).
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      agent-internal:
        ipv4_address: 172.30.240.2
      agent-egress: {}

networks:
  agent-internal:
    name: orchestrator-agent-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.240.0/24
  agent-egress:
    name: orchestrator-agent-egress
    driver: bridge
    internal: false
